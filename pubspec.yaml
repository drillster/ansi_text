name: ansi_text
description: A library for styling and formatting terminal text using the ANSI escape codes.
version: 1.5.0
repository: https://github.com/drillster/ansi_text
issue_tracker: https://github.com/drillster/ansi_text/issues
topics:
  - ansi
  - cli
  - terminal
  - styling
  - formatting

screenshots:
  - description: 'Terminal output demonstrating text markup, 8-bit RGB palettes, grayscale, and 24-bit truecolor.'
    path: examples.png

environment:
  sdk: '>=3.4.0 <4.0.0'

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.8
